name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        # Offline backend for headless rendering, Pillow (viz) for the texture
        # tests. The runner has no GPU: tests/conftest.py turns every GPU
        # adapter request into a skip, so render tests skip instead of erroring.
        run: uv sync --extra offline --extra viz --dev

      - name: Run tests
        # Tests should pass with OFFSCREEN backend only
        run: uv run pytest tests/ -v --tb=short

      - name: Run linter
        run: uv run ruff check src/
